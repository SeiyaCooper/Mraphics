[package]
name = "mraphics"
version = "0.0.2"
edition = "2024"
authors = ["SeiyaCooper"]
license = "Apache-2.0"
homepage = "https://github.com/SeiyaCooper/Mraphics"
repository = "https://github.com/SeiyaCooper/Mraphics"
readme = "README.md"
categories = ["graphics", "mathematics", "rendering"]
description = "A rendering engine for exploring interactive and intuitive math"
keywords = ["webgpu", "graphics", "graph", "math"]

[workspace]
members = ["mraphics-wasm", "packages/*", "examples/*"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["SeiyaCooper"]
license = "Apache-2.0"
homepage = "https://github.com/SeiyaCooper/Mraphics"
repository = "https://github.com/SeiyaCooper/Mraphics"

[workspace.dependencies]
mraphics = { path = ".", version = "0.0.2" }
mraphics-core = { path = "./packages/mraphics-core", version = "0.0.1" }
mraphics-mobject = { path = "./packages/mraphics-mobject", version = "0.0.1" }
wasm-bindgen = "0.2.106"
wgpu = "27.0.1"
winit = "0.30.5"
nalgebra = "0.34.1"
bytemuck = "1.24.0"
num-traits = "0.2.19"
pollster = "0.3"

[features]
default = ["native", "control", "wasm"]
native = ["dep:mraphics-native"]
control = ["dep:mraphics-control"]
wasm = ["mraphics-mobject/wasm"]

[dependencies]
mraphics-control = { path = "./packages/mraphics-control", version = "0.0.1", optional = true }
mraphics-native = { path = "./packages/mraphics-native", version = "0.0.1", optional = true }
mraphics-core = { workspace = true }
mraphics-mobject = { workspace = true }
