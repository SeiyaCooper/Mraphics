[package]
name = "mraphics"
version = "0.0.1"
edition = "2024"
authors = ["SeiyaCooper"]

[workspace]
members = ["packages/*"]
resolver = "2"

[dependencies]
wgpu = "25.0.2"
winit = "0.30.5"
pollster = "0.3"
bytemuck = "1.24.0"
nalgebra = "0.34.1"
