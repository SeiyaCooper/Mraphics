[package]
name = "mraphics"
version = "0.0.1"
edition = "2024"
authors = ["SeiyaCooper"]

[workspace]
members = ["mraphics-wasm", "packages/*"]
resolver = "2"

[features]
default = ["native", "control"]
native = ["dep:mraphics-native"]
control = ["dep:mraphics-control"]

[dependencies]
mraphics-core = { path = "./packages/mraphics-core" }
mraphics-control = { path = "./packages/mraphics-control", optional = true }
mraphics-native = { path = "./packages/mraphics-native", optional = true }
