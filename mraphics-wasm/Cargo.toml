[package]
name = "mraphics-wasm"
version = "0.0.1"
edition = "2024"
authors = ["SeiyaCooper"]

[lib]
crate-type = ["cdylib"]

[dependencies]
mraphics = { path = "..", features = [] }
wasm-bindgen = "0.2.106"
winit = "0.30.5"
wgpu = { version = "27.0.1", features = ["webgl"] }
wasm-bindgen-futures = "0.4.56"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.29"
